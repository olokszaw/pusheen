name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL reachable from iPhone
        required: true
        default: https://pulse.izanagi.online

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://pulse.izanagi.online' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test persisted activity and chat delivery
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python manage.py test \
            watchparty.tests.RoomApiTests.test_animated_telegram_sticker_is_normalized_to_lottie_json \
            watchparty.tests.RoomApiTests.test_locked_presence_write_never_breaks_api_request \
            watchparty.tests.RoomApiTests.test_activity_persists_server_calculated_month_increase \
            watchparty.tests.RoomApiTests.test_activity_streak_is_server_calculated_as_seven_days \
            watchparty.tests.RoomApiTests.test_watched_heartbeat_does_not_double_calendar_activity \
            watchparty.tests.RoomApiTests.test_message_post_is_persisted_and_visible_to_another_member \
            watchparty.tests.RoomApiTests.test_retrying_client_message_id_does_not_duplicate_chat \
            watchparty.tests.RoomApiTests.test_batch_fallback_persists_a_spam_burst_in_client_order \
            watchparty.tests.RoomApiTests.test_newer_single_message_cannot_overtake_older_fallback_batch \
            watchparty.tests.RoomApiTests.test_reply_is_persisted_and_visible_to_every_member \
            watchparty.tests.RoomApiTests.test_reply_cannot_reference_another_room \
            watchparty.tests.RoomApiTests.test_room_presence_expires_even_if_connection_counter_is_stale \
            watchparty.tests.RoomApiTests.test_sender_can_cancel_outgoing_friend_request \
            watchparty.tests.RoomApiTests.test_presence_is_real_and_privacy_aware \
            watchparty.tests.RoomApiTests.test_stale_presence_is_offline_even_without_clean_disconnect \
            watchparty.tests.RoomApiTests.test_live_room_heartbeat_is_online_even_if_app_presence_snapshot_is_stale \
            watchparty.tests.RoomApiTests.test_friend_profile_exposes_read_only_current_watching_without_room_credentials \
            watchparty.tests.RoomApiTests.test_current_watching_position_is_projected_exactly_once \
            watchparty.tests.RoomApiTests.test_current_watching_prefers_target_viewer_clock_over_stale_room_clock \
            watchparty.tests.RoomApiTests.test_stale_room_connection_is_not_shown_in_friend_profile \
            watchparty.tests.RoomApiTests.test_friend_can_range_stream_active_upload_without_joining_room \
            watchparty.tests.RoomApiTests.test_create_room_keeps_one_invite_code \
            watchparty.tests.RoomApiTests.test_room_creation_request_is_idempotent \
            watchparty.tests.RoomApiTests.test_room_snapshot_projects_playing_clock_for_rejoin \
            watchparty.tests.RoomApiTests.test_member_can_resolve_managed_stream \
            watchparty.tests.RoomApiTests.test_login_username_is_case_insensitive \
            watchparty.tests.RoomApiTests.test_guest_joins_existing_room_without_new_code \
            watchparty.tests.RoomApiTests.test_gallery_room_upload_stream_and_delete_are_one_consistent_flow \
            watchparty.tests.RoomApiTests.test_room_invitation_full_flow_and_duplicate_protection \
            watchparty.tests.RoomSocketTests.test_guest_recovers_history_and_live_chat_after_reconnect \
            watchparty.tests.RoomSocketTests.test_guest_receives_every_identical_message_from_rapid_socket_burst \
            watchparty.tests.RoomSocketTests.test_typing_status_is_realtime_and_clears_on_disconnect \
            watchparty.tests.RoomSocketTests.test_explicit_leave_is_broadcast_immediately \
            watchparty.tests.RoomSocketTests.test_transient_reconnect_does_not_emit_fake_leave_or_join \
            watchparty.tests.RoomSocketTests.test_overlapping_reconnect_does_not_make_new_socket_offline \
            watchparty.tests.RoomSocketTests.test_stale_playback_sequence_cannot_overwrite_new_seek \
            watchparty.tests.RoomSocketTests.test_owner_snapshot_cannot_pause_or_rewind_shared_clock \
            watchparty.tests.RoomSocketTests.test_guest_snapshot_updates_own_preview_without_controlling_room \
            watchparty.tests.WebStreamSelectionTests \
            --verbosity 2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate SwiftUI project
        working-directory: PusheenIOS
        run: xcodegen generate

      - name: Test activity calendar layout
        working-directory: PusheenIOS
        run: |
          swiftc Sources/ActivityCalendarLayout.swift Sources/ChatTimestampFormatter.swift Sources/Models.swift Tests/ActivityCalendarLayoutTests/main.swift -o /tmp/activity-calendar-tests
          /tmp/activity-calendar-tests
          swiftc Sources/Models.swift Sources/StickerRecentsStore.swift Tests/StickerRecentsStoreTests/main.swift -o /tmp/sticker-recents-tests
          /tmp/sticker-recents-tests
          swiftc -parse-as-library Sources/StickerAssetCache.swift Tests/StickerAssetCacheTests/main.swift -o /tmp/sticker-asset-cache-tests
          /tmp/sticker-asset-cache-tests
          swiftc Sources/PlaybackRejoinPolicy.swift Tests/PlaybackRejoinPolicyTests/main.swift -o /tmp/playback-rejoin-policy-tests
          /tmp/playback-rejoin-policy-tests
          swiftc Sources/Models.swift Sources/ChatOutboxStore.swift Tests/ChatOutboxStoreTests/main.swift -o /tmp/chat-outbox-store-tests
          /tmp/chat-outbox-store-tests
          swiftc Sources/Models.swift Tests/CurrentWatchingClockTests/main.swift -o /tmp/current-watching-clock-tests
          /tmp/current-watching-clock-tests

      - name: Build native SwiftUI app
        working-directory: PusheenIOS
        run: |
          set +e
          xcodebuild -project Pusheen.xcodeproj -scheme Pusheen \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PUSHEEN_API_BASE_URL=$API_BASE_URL \
            SYMROOT=$PWD/build build 2>&1 | tee xcodebuild.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E '(^|[[:space:]])(error:|fatal error:)' xcodebuild.log | tail -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$result"

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: PusheenIOS/xcodebuild.log
          if-no-files-found: warn
          retention-days: 3

      - name: Package IPA for Sideloadly
        working-directory: PusheenIOS
        run: |
          rm -rf Payload Pulse-unsigned.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/Pusheen.app Payload/
          zip -qry Pulse-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-unsigned-ipa
          path: PusheenIOS/Pulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
