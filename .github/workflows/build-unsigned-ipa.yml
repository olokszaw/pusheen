name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL reachable from iPhone
        required: true
        default: https://located-prime-ranks-neural.trycloudflare.com

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://located-prime-ranks-neural.trycloudflare.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate SwiftUI project
        working-directory: PusheenIOS
        run: xcodegen generate

      - name: Build native SwiftUI app
        working-directory: PusheenIOS
        run: |
          set +e
          xcodebuild -project Pusheen.xcodeproj -scheme Pusheen \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PUSHEEN_API_BASE_URL=$API_BASE_URL \
            SYMROOT=$PWD/build build 2>&1 | tee xcodebuild.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E '(^|[[:space:]])(error:|fatal error:)' xcodebuild.log | tail -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$result"

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: PusheenIOS/xcodebuild.log
          if-no-files-found: warn
          retention-days: 3

      - name: Package IPA for Sideloadly
        working-directory: PusheenIOS
        run: |
          rm -rf Payload Pulse-unsigned.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/Pusheen.app Payload/
          zip -qry Pulse-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-unsigned-ipa
          path: PusheenIOS/Pulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
