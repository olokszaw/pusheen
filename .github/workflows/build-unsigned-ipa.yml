name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL reachable from iPhone
        required: true
        default: https://trio-anderson-istanbul-definition.trycloudflare.com

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://trio-anderson-istanbul-definition.trycloudflare.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate SwiftUI project
        working-directory: PusheenIOS
        run: xcodegen generate

      - name: Build native SwiftUI app
        working-directory: PusheenIOS
        run: >-
          xcodebuild -project Pusheen.xcodeproj -scheme Pusheen
          -configuration Release -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          PUSHEEN_API_BASE_URL=$API_BASE_URL
          SYMROOT=$PWD/build build

      - name: Package IPA for Sideloadly
        working-directory: PusheenIOS
        run: |
          rm -rf Payload Pulse-unsigned.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/Pusheen.app Payload/
          zip -qry Pulse-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-unsigned-ipa
          path: PusheenIOS/Pulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
