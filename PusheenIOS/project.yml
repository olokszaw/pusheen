name: Pusheen
options:
  bundleIdPrefix: online.izanagi
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    exactVersion: 8.3.2
  PopupView:
    url: https://github.com/exyte/PopupView.git
    exactVersion: 4.0.0
  HeatmapKit:
    url: https://github.com/jacklv-coder/HeatmapKit.git
    exactVersion: 0.5.1
  Shimmer:
    url: https://github.com/markiv/SwiftUI-Shimmer.git
    exactVersion: 1.5.1
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    exactVersion: 4.5.2
targets:
  Pusheen:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Kingfisher
      - package: PopupView
      - package: HeatmapKit
      - package: Shimmer
        product: Shimmer
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.izanagi.pusheen
        PRODUCT_NAME: Pusheen
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 39
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pusheen
        INFOPLIST_KEY_CFBundleShortVersionString: 1.0
        INFOPLIST_KEY_CFBundleVersion: 39
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Pusheen uses your photo library for chat images and avatars.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pusheen uses your photo library for chat images and avatars.
        INFOPLIST_KEY_PusheenAPIBaseURL: $(PUSHEEN_API_BASE_URL)
    scheme:
      testTargets:
        - PusheenUITests
  PusheenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pusheen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pusheen
